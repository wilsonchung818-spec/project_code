<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17375e">
    <meta name="description" content="把小学高频词变成可开口、可理解、可复习的轻量英语学习系统。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="开口词卡">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css?v=1.0.0">
    <title>开口词卡 · 学校生活100词</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell">
      <header class="app-header">
        <button class="brand" type="button" data-view="learn" aria-label="返回学习页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M8 12c7-2 12 0 16 4v22c-4-4-9-6-16-4V12Z"/><path d="M40 12c-7-2-12 0-16 4v22c4-4 9-6 16-4V12Z"/><path d="M24 16v22"/></svg>
          </span>
          <span class="brand-copy">
            <strong>开口词卡</strong>
            <small>学校生活 01/100</small>
          </span>
        </button>

        <div class="header-actions">
          <span class="connection-status" id="connection-status" hidden>离线可用</span>
          <button class="header-button" id="language-button" type="button" aria-pressed="false" aria-label="显示或隐藏中文">
            <span>中</span>
          </button>
          <button class="header-button install-button" id="install-button" type="button" aria-label="安装开口词卡应用">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
          </button>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主要导航">
        <button class="nav-item is-active" type="button" data-view="learn" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/></svg>
          <span>学习</span>
        </button>
        <button class="nav-item" type="button" data-view="speak">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg>
          <span>情境</span>
        </button>
        <button class="nav-item" type="button" data-view="challenge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 12 2 2 4-5"/></svg>
          <span>挑战</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="install-sheet" id="install-sheet">
      <button class="sheet-close" type="button" data-close-dialog aria-label="关闭">×</button>
      <div class="sheet-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M8 12c7-2 12 0 16 4v22c-4-4-9-6-16-4V12Z"/><path d="M40 12c-7-2-12 0-16 4v22c4-4 9-6 16-4V12Z"/><path d="M24 16v22"/></svg>
      </div>
      <h2>安装到手机</h2>
      <div id="install-instructions"></div>
    </dialog>

    <script src="./data.js?v=1.0.0"></script>
    <script src="./app.js?v=1.0.0"></script>
  </body>
</html>
